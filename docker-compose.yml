version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.port=8501 --server.headless=true
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
